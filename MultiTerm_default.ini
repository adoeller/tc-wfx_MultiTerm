; Referenzdatei. Wird vom Plugin nicht zur Laufzeit gelesen.
; Laufzeitdatei: multiterm.ini neben der DLL. Fehlt sie, wird serialterm.ini kopiert.
; Port:COM1 ist ein Beispiel; pro COM-Port bzw. Conn:Name gelten diese Sitzungsdefaults.
[Plugin]
; Dateiname ohne .ini im languages-Ordner; z.B. en, de, uk, ru, fr, pt-br.
; Anzeigename aus [Strings] language.name der jeweiligen Datei. Englisch ist Fallback.
Language=en
; auto: TC/Windows folgen; light: hell; dark: dunkel (Einstellungsdialoge).
Theme=auto
; Optionaler SSH-Client, relativ zum DLL-Ordner oder absolut.
PuTTYNGPath=PuTTYNG.exe
; Portable Verbindungsprofile (keine Server-Schluessel), relativ zur DLL oder absolut.
SSHProfilesFile=ssh_profiles.ini
; Vorhandene KiTTY-EXE und INI; leer: automatisch erkennen/vorhandene Konfiguration.
KiTTYPath=
KiTTYConfig=
HistoryLines=10000
TerminalFontName=Consolas
TerminalFontSize=10
; Farben im RGB-Format #RRGGBB; Textfarbe bei deaktivierten ANSI-Farben und in Hex.
TerminalBackground=#0C0C0C
TerminalTextColor=#CCCCCC
HexBytesPerLine=24

[Port:COM1]
Baud=115200
DataBits=8
StopBits=0
Parity=0
Flow=0
DTR=0
RTS=0
ViewHex=0
AnsiColors=1
Charset=0
RxNewline=0
TxNewline=3
LocalEcho=0
Autoscroll=1
AutoReconnect=0
Timestamps=0
ConnectOnOpen=1
ConnectInQuickView=1
HistoryOn=1
HistoryLines=10000

; Conn:Name unterstuetzt ebenfalls alle obigen Sitzungsschluessel.
; Weitere Verbindungsschluessel (Host fuer Mode 0/1/2/4; PuTTYSession fuer Mode 3):
; Host=
; Port=23
; Mode=1

[Window]
Valid=0
Left=100
Top=100
Width=960
Height=620

; Beispiel fuer eine SSH-Verbindung ueber eine bereits gespeicherte PuTTY-Sitzung.
; Mode=0 Raw, 1 Telnet, 2 Telnet-Filter, 3 SSH/PuTTY-Profil, 4 SSH direkt.
[Conn:SSH example]
Host=
Port=22
Mode=3
PuTTYSession=My saved SSH session
; Benutzername wird nur bei Mode=4 verwendet; leer: PuTTYNG fragt ihn ab.
UserName=
; putty: Windows-PuTTY-Profile, kitty: vorhandenes KiTTY, portable: SSHProfilesFile.
SshSource=putty
ConnectOnOpen=1
ConnectInQuickView=1
; AutoReconnect/HistoryOn werden fuer SSH nicht verwendet; PuTTYNG verwaltet sein Terminal.
AutoReconnect=0
HistoryOn=0

; Direkte SSH-Verbindung, ohne gespeichertes PuTTY-Profil. Kein Passwort speichern.
[Conn:Direct SSH example]
SshSource=putty
Host=192.0.2.1
Port=22
Mode=4
PuTTYSession=
UserName=
ConnectOnOpen=1
ConnectInQuickView=1
AutoReconnect=0
HistoryOn=0

; Gespeichertes portables Profil aus ssh_profiles.ini, ohne Registry-Import.
[Conn:Portable SSH example]
Host=
Port=22
Mode=3
SshSource=portable
PuTTYSession=My portable SSH profile
UserName=
ConnectOnOpen=1
ConnectInQuickView=1
AutoReconnect=0
HistoryOn=0
